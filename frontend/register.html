<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CampusHostel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
    <main class="auth-card">
        <a class="logo" href="index.html">Campus<span>Hostel</span></a>
        <h1>Create your account</h1>
        <p>Join CampusHostel today.</p>
        <form id="registerForm">
            <label>Full name</label>
            <input type="text" id="fullName" required placeholder="Your full name">
            <label>Email address</label>
            <input type="email" id="email" required placeholder="you@example.com">
            <label>Phone number</label>
            <input type="tel" id="phone" required placeholder="Your phone number">
            <label>Password</label>
            <input type="password" id="password" required minlength="8" placeholder="At least 8 characters">
            <label>Account type</label>
            <select id="role" required>
                <option value="student">Student</option>
                <option value="owner">Hostel Owner</option>
            </select>
            <button type="submit" class="primary-button">Create Account</button>
            <p id="formMessage"></p>
        </form>
        <p>Already registered? <a href="login.html">Login here</a></p>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
